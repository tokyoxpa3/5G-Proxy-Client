name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag/ref to build (e.g. v1.5.1)'
        required: true
        default: 'v1.5.1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install NDK, build-tools and platforms
        run: |
          sdkmanager "ndk;26.3.11579264" "build-tools;35.0.0" "platforms;android-35"
          yes | sdkmanager --licenses

      - name: Restore keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          printf 'storeFile=../release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${{ secrets.KEYSTORE_PASSWORD }}" "${{ secrets.KEY_ALIAS }}" "${{ secrets.KEY_PASSWORD }}" > keystore.properties
          ls -la release.keystore keystore.properties
          cat keystore.properties | sed 's/storePassword=.*/storePassword=***/;s/keyPassword=.*/keyPassword=***/'

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"

      - name: Upload APK to GitHub Release
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          cp "$(ls app/build/outputs/apk/release/*.apk | head -1)" "5G-Proxy-Client-${TAG}.apk"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" "5G-Proxy-Client-${TAG}.apk" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
