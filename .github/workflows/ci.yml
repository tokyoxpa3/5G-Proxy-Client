name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  # Kotlin/JVM 單元測試 + debug APK 建置（需要 Android SDK + NDK）
  android-build-test:
    name: Android unit tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          ndk-version: '26.3.11579264'

      - name: Grant gradle permission
        run: chmod +x gradlew

      - name: Run Kotlin unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run lint
        run: ./gradlew lint

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  # 原生 C checksum 單元測試（host 端 gcc，不需 Android）
  native-unit-test:
    name: Native checksum unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile & run native unit tests
        run: |
          set -e
          gcc -std=c11 -Wall -Wextra -I app/src/main/cpp -o checksum_test \
            app/src/test/native/checksum_test.c app/src/main/cpp/checksum.c
          ./checksum_test
          gcc -std=c11 -Wall -Wextra -I app/src/main/cpp -o socks5_test \
            app/src/test/native/socks5_test.c app/src/main/cpp/socks5_codec.c
          ./socks5_test
          gcc -std=c11 -Wall -Wextra -I app/src/main/cpp -o dns_synth_test \
            app/src/test/native/dns_synth_test.c app/src/main/cpp/dns_synth.c
          ./dns_synth_test
          gcc -std=c11 -Wall -Wextra -I app/src/main/cpp -o tcp_packet_test \
            app/src/test/native/tcp_packet_test.c app/src/main/cpp/tcp_packet.c app/src/main/cpp/checksum.c
          ./tcp_packet_test
          gcc -std=c11 -Wall -Wextra -I app/src/main/cpp -o ip_parse_test \
            app/src/test/native/ip_parse_test.c app/src/main/cpp/ip_parse.c
          ./ip_parse_test
          gcc -std=c11 -Wall -Wextra -I app/src/main/cpp -pthread -o tun_loopback_test \
            app/src/test/native/tun_loopback_test.c app/src/main/cpp/socks5_codec.c app/src/main/cpp/tcp_packet.c app/src/main/cpp/checksum.c
          ./tun_loopback_test

      - name: Verify engine uses extracted modules (no parallel drift)
        run: |
          set -e
          for sym in socks5_build_connect_request socks5_build_udp_frame \
                     tcp_build_segment tcp_build_synack udp_build_packet \
                     dns_build_reply_pure dns_build_fake_ip6; do
            n=$(grep -c "\\b$sym\\b" app/src/main/cpp/tun_socks.c || true)
            if [ "$n" -eq 0 ]; then
              echo "ERROR: $sym 未在 tun_socks.c 中呼叫——抽離模組與引擎實作已分叉"
              exit 1
            fi
          done
          echo "所有抽離模組均已接回引擎"
