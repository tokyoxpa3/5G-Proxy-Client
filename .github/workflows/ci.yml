name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  # Kotlin/JVM 單元測試 + debug APK 建置（需要 Android SDK + NDK）
  android-build-test:
    name: Android unit tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install NDK
        run: |
          sdkmanager "ndk;26.3.11579264"
          yes | sdkmanager --licenses

      - name: Grant gradle permission
        run: chmod +x gradlew

      - name: Run Kotlin unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run lint
        run: ./gradlew lint

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  # 原生 C 單元測試（host 端 gcc，不需 Android）
  native-unit-test:
    name: Native unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compile & run native unit tests
        run: make -C app/src/test/native test

      - name: Verify engine uses extracted modules (no parallel drift)
        run: make -C app/src/test/native check-symbols

  # 封包解析器模糊測試（ASan/UBSan 下以 random mutation 抓越界與未定義行為）。
  # 純解析函式吃不可信網路輸入，是記憶體安全最敏感處，故獨立 job 常駐 sanitizer。
  native-fuzz:
    name: Native parser fuzz (ASan+UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fuzz parsers under sanitizers
        run: make -C app/src/test/native fuzz

      - name: Offset-sensitive golden tests under sanitizers
        run: make -C app/src/test/native sanitize
