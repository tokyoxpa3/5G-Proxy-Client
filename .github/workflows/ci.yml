name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  # Kotlin/JVM 單元測試 + debug APK 建置（需要 Android SDK + NDK）
  android-build-test:
    name: Android unit tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install NDK
        run: |
          sdkmanager "ndk;26.3.11579264"
          yes | sdkmanager --licenses

      - name: Grant gradle permission
        run: chmod +x gradlew

      - name: Run Kotlin unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run lint
        run: ./gradlew lint

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  # 原生 C 單元測試（host 端 gcc，不需 Android）
  native-unit-test:
    name: Native unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compile & run native unit tests
        run: |
          set -e
          gcc -std=c11 -Wall -Wextra -I app/src/main/cpp -o checksum_test \
            app/src/test/native/checksum_test.c app/src/main/cpp/checksum.c
          ./checksum_test
          gcc -std=c11 -Wall -Wextra -I app/src/main/cpp -o socks5_test \
            app/src/test/native/socks5_test.c app/src/main/cpp/socks5_codec.c
          ./socks5_test
          gcc -std=c11 -Wall -Wextra -I app/src/main/cpp -o dns_synth_test \
            app/src/test/native/dns_synth_test.c app/src/main/cpp/dns_synth.c
          ./dns_synth_test
          gcc -std=c11 -Wall -Wextra -I app/src/main/cpp -o tcp_packet_test \
            app/src/test/native/tcp_packet_test.c app/src/main/cpp/tcp_packet.c app/src/main/cpp/checksum.c
          ./tcp_packet_test
          gcc -std=c11 -Wall -Wextra -I app/src/main/cpp -o ip_parse_test \
            app/src/test/native/ip_parse_test.c app/src/main/cpp/ip_parse.c app/src/main/cpp/reasm.c
          ./ip_parse_test
          gcc -std=c11 -Wall -Wextra -I app/src/main/cpp -o reasm_test \
            app/src/test/native/reasm_test.c app/src/main/cpp/reasm.c
          ./reasm_test
          gcc -std=c11 -Wall -Wextra -I app/src/main/cpp -o ip_hash_test \
            app/src/test/native/ip_hash_test.c app/src/main/cpp/ip_hash.c
          ./ip_hash_test
          gcc -std=c11 -Wall -Wextra -I app/src/main/cpp -o tcp_state_test \
            app/src/test/native/tcp_state_test.c app/src/main/cpp/tcp_state.c
          ./tcp_state_test
          gcc -std=c11 -Wall -Wextra -I app/src/main/cpp -pthread -o tun_loopback_test \
            app/src/test/native/tun_loopback_test.c app/src/main/cpp/socks5_codec.c app/src/main/cpp/tcp_packet.c app/src/main/cpp/checksum.c
          ./tun_loopback_test
          gcc -std=c11 -Wall -Wextra -I app/src/main/cpp -o udp_session_test \
            app/src/test/native/udp_session_test.c app/src/main/cpp/udp_session.c
          ./udp_session_test
          gcc -std=c11 -Wall -Wextra -I app/src/main/cpp -o fake_dns_test \
            app/src/test/native/fake_dns_test.c app/src/main/cpp/fake_dns.c app/src/main/cpp/dns_synth.c
          ./fake_dns_test
          gcc -std=c11 -Wall -Wextra -I app/src/main/cpp -o dns_tcp_test \
            app/src/test/native/dns_tcp_test.c app/src/main/cpp/dns_tcp.c
          ./dns_tcp_test

      - name: Verify engine uses extracted modules (no parallel drift)
        run: |
          set -e
          for sym in socks5_build_connect_request socks5_build_udp_frame \
                     tcp_build_segment tcp_build_synack udp_build_packet \
                     dns_build_reply_pure dns_build_fake_ip6 \
                     reasm_insert_seg tcp_seq_gt tcp_win_field_pure tcp_parse_window_scale \
                     ip_hash_bucket tcp_isn_generate tcp_win_scaled tcp_flow_window_full \
                     tcp_srv_should_send_fin tcp_app_can_shutdown_write \
                     udp_should_buffer_first_pkt udp_is_idle \
                     fake_dns_alloc fake_dns_lookup fake_dns_lookup6 \
                     fake_dns_find_domain fake_dns_reset fake_dns_key \
                     dns_tcp_scan_frames dns_tcp_frame_len; do
            n=$(grep -c "\\b$sym\\b" app/src/main/cpp/tun_socks.c || true)
            if [ "$n" -eq 0 ]; then
              echo "ERROR: $sym 未在 tun_socks.c 中呼叫——抽離模組與引擎實作已分叉"
              exit 1
            fi
          done
          echo "所有抽離模組均已接回引擎"

  # 封包解析器模糊測試（ASan/UBSan 下以 random mutation 抓越界與未定義行為）。
  # 純解析函式吃不可信網路輸入，是記憶體安全最敏感處，故獨立 job 常駐 sanitizer。
  native-fuzz:
    name: Native parser fuzz (ASan+UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fuzz parsers under sanitizers
        run: |
          set -e
          export ASAN_OPTIONS=detect_leaks=0:halt_on_error=1
          gcc -std=c11 -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all \
            -I app/src/main/cpp -o fuzz_parsers \
            app/src/test/native/fuzz_parsers.c \
            app/src/main/cpp/ip_parse.c \
            app/src/main/cpp/reasm.c \
            app/src/main/cpp/dns_synth.c \
            app/src/main/cpp/dns_tcp.c \
            app/src/main/cpp/socks5_codec.c \
            app/src/main/cpp/tcp_packet.c \
            app/src/main/cpp/checksum.c
          ./fuzz_parsers 200000

      - name: Offset-sensitive golden tests under sanitizers
        run: |
          set -e
          export ASAN_OPTIONS=detect_leaks=0:halt_on_error=1
          gcc -std=c11 -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all \
            -I app/src/main/cpp -o ip_parse_test \
            app/src/test/native/ip_parse_test.c \
            app/src/main/cpp/ip_parse.c \
            app/src/main/cpp/reasm.c
          ./ip_parse_test
          gcc -std=c11 -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all \
            -I app/src/main/cpp -o reasm_test \
            app/src/test/native/reasm_test.c \
            app/src/main/cpp/reasm.c
          ./reasm_test
          gcc -std=c11 -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all \
            -I app/src/main/cpp -o dns_synth_test \
            app/src/test/native/dns_synth_test.c \
            app/src/main/cpp/dns_synth.c
          ./dns_synth_test
          gcc -std=c11 -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all \
            -I app/src/main/cpp -o socks5_test \
            app/src/test/native/socks5_test.c \
            app/src/main/cpp/socks5_codec.c
          ./socks5_test
          gcc -std=c11 -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all \
            -I app/src/main/cpp -o tcp_packet_test \
            app/src/test/native/tcp_packet_test.c \
            app/src/main/cpp/tcp_packet.c \
            app/src/main/cpp/checksum.c
          ./tcp_packet_test
          gcc -std=c11 -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all \
            -I app/src/main/cpp -o fake_dns_test \
            app/src/test/native/fake_dns_test.c \
            app/src/main/cpp/fake_dns.c \
            app/src/main/cpp/dns_synth.c
          ./fake_dns_test
          gcc -std=c11 -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all \
            -I app/src/main/cpp -o dns_tcp_test \
            app/src/test/native/dns_tcp_test.c \
            app/src/main/cpp/dns_tcp.c
          ./dns_tcp_test
