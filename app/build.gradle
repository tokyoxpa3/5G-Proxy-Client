plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.tokyoxpa3.socksclient'
    compileSdk 35

    defaultConfig {
        applicationId "com.tokyoxpa3.socksclient"
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName "1.5.0"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 若根目錄存在 keystore.properties 則以正式金鑰簽名（自行發布用），
            // 否則不簽名，供 F-Droid 等第三方使用自己的金鑰簽署。
            def keystoreProps = rootProject.file('keystore.properties')
            if (keystoreProps.exists()) {
                def props = new Properties()
                keystoreProps.withInputStream { props.load(it) }
                signingConfigs.create('release') {
                    storeFile file(props['storeFile'])
                    storePassword props['storePassword']
                    keyAlias props['keyAlias']
                    keyPassword props['keyPassword']
                }
                signingConfig signingConfigs.release
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('CMakeLists.txt')
            version '3.22.1'
        }
    }

    ndkVersion "26.3.11579264"

    lint {
        // 開啟 lint 門禁：既有歷史問題收進 lint-baseline.xml 逐步消化，
        // 新程式碼仍會即時被 lint 擋下。
        abortOnError true
        checkReleaseBuilds true
        baseline file('lint-baseline.xml')
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    testImplementation 'junit:junit:4.13.2'
    // Profile 序列化使用 org.json（Android 內建），JVM 單元測試需提供實作
    testImplementation 'org.json:json:20231013'
}
